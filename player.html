<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Battle | Maths Battle</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script defer src="game.js"></script></head><body><main class="panel"><header class="panel-head"><img src="assets/union-logo.png"><div><h1>JOIN THE MATHS BATTLE</h1><p>Azharul Hidaya Students Union</p></div></header><section class="card" id="join-card"><h2>Join your team</h2><label>Room code<input id="join-code" class="field" maxlength="6" placeholder="e.g. A7K9P2" autocapitalize="characters"></label><label>Your team<select id="team" class="field"><option value="A">Team A · Blue</option><option value="B">Team B · Red</option></select></label><label>Player name<input id="nickname" class="field" maxlength="18" placeholder="Enter your name"></label><button id="join" class="btn primary">Join Game</button><p id="join-msg" class="status"></p></section><section id="player-game" class="hidden"><div class="card"><span id="team-tag" class="eyebrow">TEAM A</span><h2 id="player-title">You're in the battle!</h2><p class="status" id="player-state">Waiting for host to start…</p><div class="question" id="player-question">Get ready!</div><form id="answer-form"><div class="answer-row"><input id="answer" class="field" type="number" step="any" placeholder="Your answer" required><button class="btn primary" type="submit">Submit</button></div></form><p id="feedback" class="notice">Your team's question will appear here.</p><p class="status" id="player-score"></p></div><div class="card"><img src="assets/college-logo.png" style="width:74px;height:74px;object-fit:contain" alt="College logo"><p>Al Hidaya Islamic University · Uliyil</p></div></section></main></body></html>
